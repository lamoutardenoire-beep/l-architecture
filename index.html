            --text: #ffffff;
            --accent: #00f2ff;
            --border-white: 3px solid #ffffff;
            --shadow-white: 8px 8px 0px #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            background-color: var(--bg-1);
            -webkit-font-smoothing: antialiased;
        }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
            scroll-snap-align: start;
            position: relative;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* TYPOGRAPHIE */
        h1, h2, h3, .label-style {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5.5rem);
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 4rem);

            margin-bottom: 40px;
        }

        p, li, footer {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        /* LAYOUTS */
        .hero-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .diag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* VISUELS */
        .hero-img {
            border: var(--border-white);
            box-shadow: var(--shadow-white);
            filter: grayscale(1);
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .hero-img-border {
            border: 15px solid #000 !important;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border-white);
            padding: 40px;
            box-shadow: var(--shadow-white);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .card:hover {
            transform: translate(-10px, -10px);
            box-shadow: 15px 15px 0px var(--accent);
            border-color: var(--accent);
        }

        .card-title {
            color: var(--accent);
        }

        .card-icon-wrapper {
            margin-bottom: 20px;
        }

        .card-icon {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .label-style {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 4px;
        }

        /* PIVOT NEUROMARKETING */
        .pivot-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
            align-items: baseline;
        }

        .pivot-row--top {
            padding-bottom: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pivot-row--bottom {
            padding-top: 60px;
        }

        .pivot-text {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
        }

        .pivot-text--muted {
            opacity: 0.6;
        }

        .pivot-highlight {
            color: var(--accent);
            font-weight: 700;
        }

        .offer-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 60px;
            border: var(--border-white);
            display: grid;
            grid-template-columns: 2fr 1fr;
            align-items: center;
            box-shadow: var(--shadow-white);
            gap: 40px;
        }

        .offer-heading {
            font-size: clamp(2rem, 4vw, 3.5rem);
        }

        .offer-intro {
            font-size: 1.1rem;
            margin-top: 15px;
            opacity: 0.8;
            max-width: 500px;
        }

        .offer-before-after {
            font-size: 0.95rem;
            margin-top: 18px;
            opacity: 0.85;
        }

        .offer-price-text {
            font-size: 0.9rem;
            margin-top: 20px;

        }

            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 220px;

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIORA | Architecte de Systèmes</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* Palette de nuances pour les diapositives */
            --bg-1: #05051a; /* Bleu nuit originel */
            --bg-2: #080826; /* Nuance légèrement plus claire */
            --bg-3: #030312; /* Nuance plus sombre */
            
            --text: #ffffff;
            --accent: #00f2ff; /* Cyan Électrique */
            --border-white: 3px solid #ffffff;
            --shadow-white: 8px 8px 0px #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }

        body {
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            -webkit-font-smoothing: antialiased;
        }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            scroll-snap-align: start;
            position: relative;
        }

        /* Application des nuances par diapositive */
        .slide-1 { background-color: var(--bg-1); }
        .slide-2 { background-color: var(--bg-2); }
        .slide-3 { background-color: var(--bg-3); }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        h1, h2, h3 {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            line-height: 0.9;
        }

        /* --- LAYOUTS --- */
        .hero-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        h1 { font-size: clamp(3rem, 8vw, 6rem); }

        .hero-img {
            border: var(--border-white);
            box-shadow: var(--shadow-white);
            filter: grayscale(1);
            width: 100%;
            background: #fff;
            object-fit: cover;
        }

        .section-title {
            font-size: 4rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .section-sub {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 40px auto;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .diag-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: var(--border-white);
            padding: 40px;
            box-shadow: var(--shadow-white);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover {
            transform: translate(-10px, -10px);
            box-shadow: 15px 15px 0px var(--accent);
            border-color: var(--accent);
        }

        .offer-box {
            background: transparent;
            padding: 80px;
            border: var(--border-white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-white);
            gap: 40px;
        }

        .price {
            font-size: 7rem;
            font-weight: 800;
            color: var(--accent);
            font-family: 'Syne';
        }

        .btn-cta {
            background: var(--text);
            color: #000;
            padding: 25px 50px;
            text-decoration: none;
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
